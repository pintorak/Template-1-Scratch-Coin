<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ขอโทษนะเธอ ♡</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;

      font-family: 'Mali', cursive;
      color: #CD5782;

      background-color: #F0EEF3;
      background-image: radial-gradient(
        #C7DAD8 2px,
        transparent 2px
      );
      background-size: 24px 24px;
    }

    .page {
      width: 100%;
      max-width: 520px;
    }

    .card {
      position: relative;
      padding: 42px 28px 36px;
      text-align: center;

      background: rgba(255, 255, 255, 0.82);
      border: 3px solid #DCD3AA;
      border-radius: 28px;

      box-shadow:
        0 12px 30px rgba(205, 87, 130, 0.12);
    }

    .heart {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Itim', cursive;
      font-size: 38px;
      font-weight: 400;
      color: #CD5782;
    }

    .intro {
      margin: 0 auto 28px;
      max-width: 380px;
      line-height: 1.9;
      font-size: 15px;
      color: #6f6468;
    }

    .coin {
      width: 82px;
      height: 82px;
      margin: 10px auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #DCD3AA;
      border: 5px solid #C7AD70;

      font-size: 38px;

      box-shadow:
        0 5px 0 #b69f68,
        0 10px 18px rgba(0,0,0,0.12);
    }

    .hint {
      font-size: 13px;
      color: #8a7f83;
      margin-bottom: 24px;
    }

    .scratch-box {
      position: relative;
      width: 100%;
      min-height: 170px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background: #C7DAD8;
      border-radius: 20px;
      overflow: hidden;
    }

    .message {
      color: #CD5782;
      font-size: 16px;
      line-height: 1.9;
      font-weight: 500;
    }

    .scratch-cover {
      position: absolute;
      inset: 0;
      background: #aaa9a9;
      display: flex;
      align-items: center;
      justify-content: center;

      color: #F0EEF3;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .bottom {
      margin-top: 24px;
      font-size: 12px;
      color: #999093;
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="heart">♡</div>

      <h1>เรามีอะไรอยากบอก</h1>

      <p class="intro">
        ช่วงนี้เราไม่มีเวลาให้เธอเลยใช่ไหม...
        <br>
        เรามีอะไรอยากบอก
        <br>
        แต่ไม่อยากพูดออกมาตรง ๆ
      </p>

      <div class="coin">🪙</div>

      <div class="hint">
        หยิบเหรียญแล้วขูดดูสิ
      </div>

      <div class="scratch-box">

        <div class="message">
          ข้อความของเราจะอยู่ตรงนี้ ♡
        </div>

        <div class="scratch-cover">
          ขูดตรงนี้นะ ♡
        </div>

      </div>

      <div class="bottom">
        ค่อย ๆ ขูดนะ มีอะไรอยากให้เธอรู้ ♡
      </div>

    </section>

  </main>

</body>
</html>
